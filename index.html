<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masmoud Y. — Nouveau Portfolio</title>

  <!-- SEO -->
  <meta name="description" content="Masmoud Yacoubou, Développeur Full-Stack basé à Cotonou. Mon portfolio a déménagé." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://masmoud-yacoubou.vercel.app/fr" />
  <meta name="google-site-verification" content="L-IpB80owb0c88aZVYxVbkA4858kr-Qng4gFZVTdn_c" />

  <!-- Redirection automatique après 8 secondes -->
  <meta http-equiv="refresh" content="8;url=https://masmoud-yacoubou.vercel.app/fr" />

  <!-- Open Graph -->
  <meta property="og:title" content="Masmoud Y. — Nouveau Portfolio" />
  <meta property="og:description" content="Mon portfolio a déménagé vers une nouvelle adresse." />
  <meta property="og:url" content="https://masmoud-yacoubou.vercel.app/fr" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #060606;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    /* Logo */
    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #2563eb;
      border-radius: 50%;
      display: inline-block;
      margin: 0 3px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(1.5); }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 600;
      color: #2563eb;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(37, 99, 235, 0.25);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #2563eb;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Titre */
    h1 {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1.0;
      margin-bottom: 16px;
    }

    h1 span { color: #2563eb; }

    /* Description */
    .description {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.7;
      margin-bottom: 40px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Bouton */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 32px;
      transition: background 0.3s ease, gap 0.3s ease;
      margin-bottom: 24px;
    }

    .btn:hover {
      background: #1d4ed8;
      gap: 16px;
    }

    /* Compteur */
    .countdown {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.18);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .countdown strong {
      color: #2563eb;
      font-weight: 700;
    }

    /* Séparateur */
    .divider {
      width: 1px;
      height: 40px;
      background: rgba(255, 255, 255, 0.06);
      margin: 0 auto 24px;
    }

    /* Ancien lien */
    .old-link {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.15);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s ease;
    }

    .old-link:hover {
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Logo -->
    <div class="logo">
      M <span class="dot"></span> Y
    </div>

    <!-- Badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      Nouveau portfolio disponible
    </div>

    <!-- Titre -->
    <h1>Ce site a<br /><span>déménagé</span>.</h1>

    <!-- Description -->
    <p class="description">
      Mon portfolio a été entièrement repensé avec de nouvelles technologies et un nouveau design.
      Tu seras redirigé automatiquement dans quelques secondes.
    </p>

    <!-- Bouton -->
    <div>
      <a href="https://masmoud-yacoubou.vercel.app/fr" class="btn">
        Voir le nouveau portfolio
        <span>→</span>
      </a>
    </div>

    <!-- Compteur -->
    <p class="countdown">
      Redirection dans <strong id="count">8</strong> secondes
    </p>

    <!-- Séparateur -->
    <div class="divider"></div>

    <!-- Lien vers l'ancien site (discret) -->
    <a
      href="https://masmoud-yacoubou.github.io/dev/ancien-portfolio"
      class="old-link"
    >
      Accéder à l'ancien site →
    </a>

  </div>

  <script>
    let count = 8;
    const el = document.getElementById("count");

    const timer = setInterval(() => {
      count--;
      if (el) el.textContent = count;
      if (count <= 0) {
        clearInterval(timer);
        window.location.href = "https://masmoud-yacoubou.vercel.app/fr";
      }
    }, 1000);
  </script>

</body>
</html>
